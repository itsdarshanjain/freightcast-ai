services:
  - type: web
    name: freightcast-ai
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: sih2026-prakalp-freight-forecast-secret-key
      - key: MONGODB_URI
        value: mongodb://localhost:27017/freight-forecast
